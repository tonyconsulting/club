<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Unlock</title>
<meta name="description" content="Un écosystème gratuit pour apprendre les marchés financiers, avec des gens autour de toi.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Unlock">
<meta property="og:title" content="Unlock">
<meta property="og:description" content="Apprends les marchés financiers, avec des gens autour de toi. Accès gratuit.">
<meta property="og:image" content="https://tonyconsulting.github.io/club/partage.jpg?v=86">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Unlock">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=35">
<style>
.hub{max-width:520px;margin:0 auto;padding:40px 20px 60px;text-align:center}
.hub .identite{margin-bottom:22px}
.hub h1{font-size:clamp(24px,5vw,32px);margin:6px 0 22px}
.porte{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-align:left;margin-bottom:12px;transition:border-color .2s,transform .15s;position:relative}
.porte:hover{border-color:var(--accent);transform:translateY(-1px)}
.porte b{display:block;font-family:Manrope,Inter,sans-serif;font-size:17px;font-weight:700;margin-bottom:3px}
.porte span{display:block;color:var(--dim);font-size:14px}
.porte::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--accent);border-top:2px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.hub .legal{margin-top:34px}
</style>
</head>
<body>
<header class="top"><a href="index.html" class="marque" id="marque"></a></header>
<main class="hub">
  <div class="identite" id="identite"></div>
  <h1 id="titre"></h1>
  <div id="portes"></div>
  <p class="legal" id="legal"></p>
</main>
<script src="config.js?v=35"></script>
<script>
(function(){
  const C=window.CLUB||{}, esc=(t)=>String(t==null?"":t).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  Object.entries(C.theme||{}).forEach(([k,v])=>{ if(v) document.documentElement.style.setProperty("--"+k,v); });
  const A=C.accent||"#6E9BFF"; document.documentElement.style.setProperty("--accent",A);
  const rgb=/^#([0-9a-f]{6})$/i.test(A)?[1,3,5].map(i=>parseInt(A.slice(i,i+2),16)).join(","):"110,155,255"; document.documentElement.style.setProperty("--accent-rgb",rgb);
  const ref=(new URLSearchParams(location.search).get("r")||"").toLowerCase().replace(/[^a-z0-9_-]/g,"");
  const contacts=C.contacts||{}, contact=contacts[ref]||contacts[C.contactParDefaut]||Object.values(contacts)[0]||{prenom:"",lien:"#"};
  const q=contacts[ref]?"?r="+ref:"";
  document.getElementById("marque").innerHTML=C.logo?`<img src="${esc(C.logo)}" alt="${esc(C.nom)}">`:`<span class="wordmark">${esc(String(C.nom||"").toUpperCase())}</span>`;
  document.title=(contact.nom||C.nom)+" · "+C.nom;
  const id=document.getElementById("identite");
  if(contact.photo||contact.nom) id.innerHTML=`${contact.photo?`<img class="iavatar" src="${esc(contact.photo)}" alt="">`:""}<div><div class="inom">${esc(contact.nom||contact.prenom)}</div><div class="isuite">${contact.handle?"@"+esc(contact.handle):""}${contact.handle&&contact.abonnes?" · ":""}${contact.abonnes?`<b>${esc(contact.abonnes)} abonnés</b>`:""}</div></div>`; else id.remove();
  document.getElementById("titre").textContent=C.hubTitre||"Par où tu veux commencer ?";
  document.getElementById("portes").innerHTML=(C.hubPortes||[]).map(p=>{
    let href=p.mlm?(contact.mlm||contact.lien||"#"):(p.lien||"#");
    if(!p.mlm&&/^[a-z0-9_-]+\.html$/i.test(href)) href+=q;
    if(p.lien==="preuves.html"&&C.lienCanal&&!(C.preuves||[]).length) href=C.lienCanal;
    const ext=/^https?:/i.test(href);
    return `<a class="porte" href="${esc(href)}"${ext?' target="_blank" rel="noopener"':""}><b>${esc(p.titre)}</b><span>${esc(p.texte)}</span></a>`;
  }).join("");
  document.getElementById("legal").textContent=C.legal2||"";
})();
</script>
</body>
</html>
