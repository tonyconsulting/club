<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Unlock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=30">
<style>
.pr{max-width:var(--max);margin:0 auto;padding:40px 20px 60px;text-align:center}
.pr h1{font-size:clamp(26px,5vw,40px);margin-bottom:10px}
.grille-preuves{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:26px}
.tuile{aspect-ratio:4/5;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface);cursor:zoom-in;padding:0;transition:transform .2s,border-color .2s}
.tuile:hover{transform:translateY(-3px);border-color:var(--line2)}
.tuile img{width:100%;height:100%;object-fit:cover;display:block}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.btn2{display:inline-block;border:1px solid var(--line2);color:var(--ink);padding:14px 24px;border-radius:99px;font-weight:600;font-size:15px}
.btn2:hover{border-color:var(--accent)}
.pr .legal{margin-top:34px}
</style>
</head>
<body>
<header class="top"><a href="index.html" class="marque" id="marque"></a></header>
<main class="pr">
  <h1 id="titre"></h1>
  <p class="sous" id="sous"></p>
  <p class="note" id="note"></p>
  <div class="grille-preuves" id="grille"></div>
  <div class="actions"><a class="btn2" id="canal" target="_blank" rel="noopener" hidden>Rejoindre le canal</a><a class="cta" id="cta" target="_blank" rel="noopener" style="margin-top:0"></a></div>
  <p class="legal" id="legal"></p>
</main>
<div class="lightbox" id="lightbox" hidden><button class="fermer" id="fermer" aria-label="Fermer">×</button><div class="lbc" id="lbc"></div></div>
<script src="config.js?v=29"></script>
<script>
(function(){
  const C=window.CLUB||{}, esc=(t)=>String(t==null?"":t).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  Object.entries(C.theme||{}).forEach(([k,v])=>{ if(v) document.documentElement.style.setProperty("--"+k,v); });
  const A=C.accent||"#6E9BFF"; document.documentElement.style.setProperty("--accent",A);
  const rgb=/^#([0-9a-f]{6})$/i.test(A)?[1,3,5].map(i=>parseInt(A.slice(i,i+2),16)).join(","):"110,155,255"; document.documentElement.style.setProperty("--accent-rgb",rgb);
  const ref=(new URLSearchParams(location.search).get("r")||"").toLowerCase().replace(/[^a-z0-9_-]/g,"");
  const contacts=C.contacts||{}, contact=contacts[ref]||contacts[C.contactParDefaut]||Object.values(contacts)[0]||{prenom:"",lien:"#"};
  document.getElementById("marque").innerHTML=C.logo?`<img src="${esc(C.logo)}" alt="${esc(C.nom)}">`:`<span class="wordmark">${esc(String(C.nom||"").toUpperCase())}</span>`;
  document.title=(C.preuvesTitre||"Témoignages")+" · "+C.nom;
  document.getElementById("titre").textContent=C.preuvesTitre||"Ce que disent les membres.";
  document.getElementById("sous").textContent=C.preuvesSous||"";
  const ph=(n)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="440" height="550" viewBox="0 0 440 550"><rect width="440" height="550" fill="#141414"/><rect x="24" y="24" width="392" height="502" rx="14" fill="#1b1b1b" stroke="#2a2a2a"/><circle cx="72" cy="80" r="20" fill="#2a2a2a"/><rect x="104" y="66" width="140" height="12" rx="6" fill="#2e2e2e"/><rect x="104" y="86" width="90" height="10" rx="5" fill="#262626"/><rect x="52" y="130" width="336" height="14" rx="7" fill="#2a2a2a"/><rect x="52" y="156" width="300" height="14" rx="7" fill="#2a2a2a"/><rect x="52" y="182" width="320" height="14" rx="7" fill="#2a2a2a"/><rect x="52" y="208" width="200" height="14" rx="7" fill="#2a2a2a"/><text x="220" y="330" text-anchor="middle" font-family="Inter,Helvetica,Arial" font-size="22" fill="#6b6b6b">Capture ${n}</text><text x="220" y="362" text-anchor="middle" font-family="Inter,Helvetica,Arial" font-size="14" fill="#4a4a4a">exemple, à remplacer</text></svg>`);
  const liste=(C.preuves||[]).map((p,i)=>p==="placeholder"?ph(i+1):p);
  const note=document.getElementById("note"); if((C.preuves||[]).includes("placeholder")&&C.preuvesNote) note.textContent=C.preuvesNote; else note.remove();
  document.getElementById("grille").innerHTML=liste.map((s,i)=>`<button class="tuile" data-src="${esc(s)}" aria-label="Agrandir"><img src="${esc(s)}" alt="Témoignage ${i+1}" loading="lazy"></button>`).join("");
  const lb=document.getElementById("lightbox"), lbc=document.getElementById("lbc");
  document.getElementById("grille").addEventListener("click",(e)=>{const t=e.target.closest(".tuile"); if(!t) return; lbc.innerHTML=`<img src="${esc(t.dataset.src)}" alt="Capture">`; lb.hidden=false;});
  const ferme=()=>{lb.hidden=true; lbc.innerHTML="";}; document.getElementById("fermer").addEventListener("click",ferme); lb.addEventListener("click",(e)=>{if(e.target===lb) ferme();}); document.addEventListener("keydown",(e)=>{if(e.key==="Escape") ferme();});
  const canal=document.getElementById("canal"); if(C.lienCanal){canal.href=C.lienCanal; canal.hidden=false;}
  const cta=document.getElementById("cta"); cta.textContent=(C.boutonTexte||"Écris-moi sur Insta").replace(/\{prenom\}/g,contact.prenom); cta.href=contact.lien||"#";
  document.getElementById("legal").textContent=C.legal2||"";
})();
</script>
</body>
</html>
