<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Le club</title>
<meta name="description" content="Un environnement gratuit pour apprendre les marchés financiers, accompagné.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=27">
</head>
<body>

<header class="top">
  <a href="#" class="marque" id="marque"></a>
</header>

<main>

  <section class="hero" id="hero">
    <div class="identite reveal" id="identite"></div>
    <div class="badge reveal" id="badge"><span class="dot"></span><span id="badgeTexte">Accès gratuit</span></div>
    <h1 class="reveal" id="h1"></h1>
    <p class="sous reveal" id="sousTitre"></p>
  </section>

  <section class="etape" id="etape1">
    <p class="kicker reveal">Étape 1</p>
    <h2 class="reveal" id="titreVideo"></h2>
    <div class="video reveal" id="videoHero"></div>
  </section>

      <section class="etape" id="chiffresSection">
    <p class="kicker reveal">Le club en chiffres</p>
    <div class="chiffres" id="chiffres"></div>
  </section>

  <section class="etape temoignages" id="temoignages">
    <h2 class="reveal" id="temoignagesTitre"></h2>
    <p class="sous reveal" id="temoignagesSous"></p>
    <p class="note reveal" id="temoignagesNote"></p>
    <div class="ticker" id="ticker"><div class="ttrack" id="ttrack"></div></div>
    <div class="marquee"><div class="track" id="track"></div></div>
  </section>

<section class="etape" id="etape2">
    <p class="kicker reveal">Étape 2</p>
    <h2 class="reveal">Ce que tu trouves dans le club, concrètement.</h2>
    <div class="grille" id="acces"></div>
  </section>

<section class="etape" id="etape3">
    <p class="kicker reveal">Étape 3</p>
    <h2 class="reveal">Comment ça se passe.</h2>
    <ol class="deroule" id="deroule"></ol>
  </section>

  <section class="etape" id="gratuitSection">
    <p class="kicker reveal">Pourquoi c'est gratuit</p>
    <div class="gratuit reveal"><div class="gphoto" id="gratuitPhoto"></div><div class="gtexte"><h2 id="gratuitTitre"></h2><div id="gratuitTextes"></div></div></div>
  </section>

  <section class="etape" id="faqSection">
    <p class="kicker reveal">Les questions qu'on nous pose avant d'entrer</p>
    <div class="faq" id="faq"></div>
  </section>

  <section class="final reveal" id="final">
    <h2 id="finalTitre"></h2>
    <p class="sous" id="finalTexte"></p>
    <ul class="lignes" id="finalLignes"></ul>
    <div class="actions"><a class="cta" id="cta" href="#" target="_blank" rel="noopener"></a><a class="btn2" id="canalIndex" target="_blank" rel="noopener" hidden>Voir le canal</a></div>
    <p class="anti" id="antiUrgence"></p>
  </section>

</main>

<footer>
  <p class="legal" id="legal1"></p>
  <p class="legal" id="legal2"></p>
  <p class="legal editeur" id="editeur"></p>
  <p class="copy" id="copy"></p>
</footer>

<div class="lightbox" id="lightbox" hidden><button class="fermer" id="fermer" aria-label="Fermer">×</button><div class="lbc" id="lightboxContenu"></div></div>

<script src="config.js?v=29"></script>
<script src="app.js?v=27"></script>
</body>
</html>
