<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Unlock</title>
<meta name="description" content="Un écosystème gratuit pour apprendre les marchés financiers, avec des gens autour de toi.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Unlock">
<meta property="og:title" content="Unlock">
<meta property="og:description" content="Apprends les marchés financiers, avec des gens autour de toi. Accès gratuit.">
<meta property="og:image" content="https://tonyconsulting.github.io/club/partage.jpg?v=75">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Unlock">
<meta name="twitter:image" content="https://tonyconsulting.github.io/club/partage.jpg?v=75">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=75">
</head>
<body>

<header class="top">
  <a href="#" class="marque" id="marque"></a>
</header>

<main>

  <section class="hero" id="hero">
    <div class="identite reveal" id="identite"></div>
    <div class="badge reveal" id="badge"><span class="dot"></span><span id="badgeTexte">Accès gratuit</span></div>
    <h1 class="reveal" id="h1"></h1>
    <p class="sous reveal" id="sousTitre"></p>
  </section>

  <section class="etape" id="etape1">
    <p class="kicker reveal">Étape 1</p>
    <h2 class="reveal" id="titreVideo"></h2>
    <div class="video reveal" id="videoHero"></div>
  </section>

      <section class="etape" id="chiffresSection">
    <p class="kicker reveal">Le club en chiffres</p>
    <div class="chiffres" id="chiffres"></div>
    <p class="cta-inline"><a class="cta cta-plus" data-pos="chiffres" href="#" target="_blank" rel="noopener"></a></p>
  </section>

  <section class="etape temoignages" id="temoignages">
    <h2 class="reveal" id="temoignagesTitre"></h2>
    <p class="sous reveal" id="temoignagesSous"></p>
    <p class="note reveal" id="temoignagesNote"></p>
    <div class="ticker" id="ticker"><div class="ttrack" id="ttrack"></div></div>
    <div class="carrousel">
      <div class="piste" id="track"></div>
      <div class="nav"><button class="fl fl-g" id="flG" aria-label="Précédent"></button><div class="points" id="points"></div><button class="fl fl-d" id="flD" aria-label="Suivant"></button></div>
    </div>
  </section>

<section class="etape" id="etape3">
    <p class="kicker reveal">Étape 2</p>
    <h2 class="reveal">Comment ça se passe.</h2>
    <ol class="deroule" id="deroule"></ol>
  </section>

  <section class="etape" id="gratuitSection">
    <p class="kicker reveal">Pourquoi c'est gratuit</p>
    <div class="gratuit reveal"><div class="gphoto" id="gratuitPhoto"></div><div class="gtexte"><h2 id="gratuitTitre"></h2><div id="gratuitTextes"></div></div></div>
  </section>

  <section class="etape" id="resultatsSection">
    <p class="kicker reveal">Résultats</p>
    <h2 class="reveal" id="resultatsTitre"></h2>
    <p class="sous reveal" id="resultatsSous"></p>
    <p class="note reveal" id="resultatsNote"></p>
    <div class="grille-res" id="resultats"></div>
    <p class="cta-inline"><button class="btn2" id="resultatsPlus" type="button" hidden>Voir plus de résultats</button></p>
    <p class="cta-inline"><a class="cta cta-plus" data-pos="resultats" href="#" target="_blank" rel="noopener"></a></p>
  </section>

  <section class="etape" id="faqSection">
    <p class="kicker reveal">Les questions qu'on nous pose avant d'entrer</p>
    <div class="faq" id="faq"></div>
  </section>

  <section class="final reveal" id="final">
    <h2 id="finalTitre"></h2>
    <p class="sous" id="finalTexte"></p>
    <ul class="lignes" id="finalLignes"></ul>
    <div class="actions"><a class="cta" id="cta" href="#" target="_blank" rel="noopener"></a><a class="btn2" id="canalIndex" target="_blank" rel="noopener" hidden>Voir le canal</a></div>
    <p class="anti" id="antiUrgence"></p>
  </section>

</main>

<footer>
  <p class="legal" id="legal1"></p>
  <p class="legal" id="legal2"></p>
  <p class="legal editeur" id="editeur"></p>
  <p class="copy" id="copy"></p>
</footer>

<div class="lightbox" id="lightbox" hidden><button class="fermer" id="fermer" aria-label="Fermer">×</button><div class="lbc" id="lightboxContenu"></div></div>

<script src="config.js?v=75"></script>
<script src="app.js?v=75"></script>
</body>
</html>
